# Apple light: colors for the kitty tab herdr runs in (herdr-theme apple).
# White pane surfaces; herdr's #f5f5f7 app background and #eceef2 sidebar are
# drawn translucent.
foreground           #24262b
background           #ffffff
cursor               #007aff
cursor_text_color    #ffffff
selection_foreground #24262b
selection_background #dce9ff
url_color            #0066cc
transparent_background_colors #f5f5f7@0.8 #eceef2@0.8

# Apple's accessible system colors for 1-6 (readable on white), the regular
# system colors as the bright set. 7 and 8 are the grays apps use for muted
# text, kept dark enough to read on white.
color0  #24262b
color1  #d70015
color2  #248a3d
color3  #b25000
color4  #0040dd
color5  #8944ab
color6  #0071a4
color7  #6e727a
color8  #5c6068
color9  #ff3b30
color10 #34c759
color11 #ff9500
color12 #007aff
color13 #af52de
color14 #32ade6
color15 #d8dce3
