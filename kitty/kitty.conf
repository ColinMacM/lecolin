# ~/.config/kitty/kitty.conf
# Reload after editing without restarting: Ctrl+Shift+F5

# ── Font / text ──────────────────────────────────────────────
font_family      family="JetBrains Mono" style="Medium"
bold_font        family="JetBrains Mono" style="ExtraBold"
italic_font      family="JetBrains Mono" style="Medium Italic"
bold_italic_font family="JetBrains Mono" style="ExtraBold Italic"
font_size        13.5
# Previously: font_family monospace (DejaVu Sans Mono), auto bold/italic, 12.0.
# Nerd Font icons (prompts, agent glyphs) still come from FiraCode Nerd Font.
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD FiraCode Nerd Font Mono
# Render text the way macOS does (gamma 1.7, contrast 30) instead of Linux's
# 1.0 / 0: dark text on light backgrounds comes out heavier and less washed out.
text_composition_strategy 1.7 30

# ── Bell ─────────────────────────────────────────────────────
enable_audio_bell no

# ── Remote control ───────────────────────────────────────────
# Enables the `kitty @ ...` scripting API (e.g. `kitty @ get-text`).
allow_remote_control yes
listen_on unix:/tmp/kitty

# ── Links / URLs ─────────────────────────────────────────────
# Ctrl+Shift+click a URL to open it; Ctrl+Shift+E for keyboard hint mode.
detect_urls yes
# open_url_with: "default" uses the OS default browser
open_url_with default
url_style curly
# underline_hyperlinks: underline OSC-8 hyperlinks on hover
underline_hyperlinks hover

# ── Theme ────────────────────────────────────────────────────
# Loaded by the BEGIN_KITTY_THEME block at the end of this file, which
# `kitten themes` rewrites on every switch. A window running herdr gets herdr's
# own colors on top (herdr_tab.py watcher, herdr-theme); others use this theme.
watcher herdr_tab.py

# ── GUI / window chrome ──────────────────────────────────────
# Colors are supplied by current-theme.conf.
background_opacity    0.95
# Lets herdr_tab.py make the window solid while herdr's tab is in front
# (its panes use the default background, which this opacity applies to).
# kitty reads this only at startup: restart kitty after changing it.
dynamic_background_opacity yes
window_padding_width  8
hide_window_decorations no
# Thicker lines: herdr's pane frames and other box-drawing borders (kitty draws
# those itself; pt for thin, normal, thick, very thick; default 0.001, 1, 1.5, 2)
# and the borders between kitty split windows (default 0.5pt).
box_drawing_scale     0.001, 1.75, 2.5, 3
window_border_width   1.5pt
cursor_shape          beam
confirm_os_window_close 1

# ── Tab bar appearance ───────────────────────────────────────
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{index}: {title}"
active_tab_font_style   bold

# ── Tab navigation ───────────────────────────────────────────
# Switch to a tab by number (kitty has NO default binding for this)
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
# goto_tab 0 jumps back to the previously active tab
map ctrl+0 goto_tab 0

# ── Window tiling (splits) ───────────────────────────────────
# The splits layout allows arbitrary tmux-style arrangements. It is listed
# first, so it is the startup layout. Cycle layouts with Ctrl+Shift+L.
# split_axis is the fallback for splits made without an explicit --location:
# auto = split the longer axis. (horizontal = side by side, vertical = stacked.)
# Multiple layout options are separated by ";", layouts by ",".
enabled_layouts splits:split_axis=auto,stack,tall,fat,grid

# Directional splits. --location only takes effect in the splits layout;
# "split" picks the axis automatically (wide window -> right, tall -> down).
# Ctrl+Shift+ d and \ are the only mnemonic keys kitty leaves unbound here;
# ctrl+shift+enter deliberately replaces the default new_window.
#
# --cwd=oldest follows the shell instead of a newer foreground helper process
# that may have changed its own working directory (for example a clipboard tool).
map ctrl+shift+backslash launch --location=vsplit --cwd=oldest
map ctrl+shift+d         launch --location=hsplit --cwd=oldest
map ctrl+shift+enter     launch --location=split  --cwd=oldest

# New tab in the current directory (default ctrl+shift+t starts in $HOME).
map ctrl+shift+t         launch --type=tab --cwd=oldest

# Move focus. Ctrl+arrow, not Ctrl+Shift+arrow, because kitty binds those to
# scroll_line_up/down and next_tab/previous_tab by default.
map ctrl+left  neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up    neighboring_window up
map ctrl+down  neighboring_window down

# macOS reserves Ctrl+arrow for Spaces/Mission Control; add Cmd alternatives.
# globinclude quietly skips this file on other operating systems.
globinclude os-${KITTY_OS}.conf

# Move the focused window within the layout
map ctrl+alt+left  move_window left
map ctrl+alt+right move_window right
map ctrl+alt+up    move_window up
map ctrl+alt+down  move_window down

# Flip a split's axis (rotate 180 instead swaps the two windows)
map ctrl+alt+r layout_action rotate

# Zoom the focused window, and even out all splits
map ctrl+alt+z toggle_layout stack
map ctrl+alt+e layout_action equalize

# Resize: Ctrl+Shift+R enters resize mode (arrows/hjkl, Esc to finish).
# "layout_action bias 70" gives the focused window 70% of its parent instead.

# ── Scrollback ───────────────────────────────────────────────
touch_scroll_multiplier 3.0
wheel_scroll_multiplier 10.0
map ctrl+shift+k    remote_control scroll-window 5-
map ctrl+shift+up   remote_control scroll-window 5-
map ctrl+shift+j    remote_control scroll-window 5
map ctrl+shift+down remote_control scroll-window 5

# Ctrl+Shift+[ or Ctrl+Shift+H opens color-preserving Neovim copy mode; q quits.
# :30 / 30G jumps to the 30th line from the bottom. Resolve the config at runtime
# rather than embedding this machine's Homebrew or home-directory paths.
scrollback_pager sh -c 'exec nvim -i NONE -n --noplugin -u "${KITTY_CONFIG_DIRECTORY:-${XDG_CONFIG_HOME:-$HOME/.config}/kitty}/scrollback.lua" -'
map ctrl+shift+[ show_scrollback
map ctrl+shift+h show_scrollback

# ── Titles ───────────────────────────────────────────────────
# The default set_tab_title chord (ctrl+shift+alt+t) never reaches kitty:
# gnome-settings-daemon grabs the keycode for its <Primary><Alt>t terminal
# launcher even with Shift held, so kitty sees the modifiers and no "t".
map f2       set_tab_title
map shift+f2 set_window_title


# BEGIN_KITTY_THEME
# Tokyo Night Storm
include current-theme.conf
# END_KITTY_THEME