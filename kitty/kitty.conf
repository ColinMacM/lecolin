# ~/.config/kitty/kitty.conf
# Reload after editing without restarting: Ctrl+Shift+F5

# ── Font / text ──────────────────────────────────────────────
font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
# Run `kitten choose-fonts` (or `kitty +list-fonts`) to pick a real family,
# then replace "monospace" above (e.g. JetBrains Mono, FiraCode Nerd Font).

# ── Bell ─────────────────────────────────────────────────────
enable_audio_bell no

# ── Remote control ───────────────────────────────────────────
# Enables the `kitty @ ...` scripting API (e.g. `kitty @ get-text`).
allow_remote_control yes
listen_on unix:/tmp/kitty

# ── Links / URLs ─────────────────────────────────────────────
# Ctrl+Shift+click a URL to open it; Ctrl+Shift+E for keyboard hint mode.
detect_urls yes
# open_url_with: "default" uses the OS default browser
open_url_with default
url_style curly
url_color #89b4fa
# underline_hyperlinks: underline OSC-8 hyperlinks on hover
underline_hyperlinks hover

# ── GUI / window chrome ──────────────────────────────────────
background            #1e1e2e
foreground            #cdd6f4
background_opacity    0.95
window_padding_width  8
hide_window_decorations no
cursor_shape          beam
confirm_os_window_close 1

# ── Tab bar appearance ───────────────────────────────────────
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{index}: {title}"
active_tab_foreground   #11111b
active_tab_background   #cba6f7
active_tab_font_style   bold
inactive_tab_foreground #cdd6f4
inactive_tab_background #45475a

# ── Tab navigation ───────────────────────────────────────────
# Switch to a tab by number (kitty has NO default binding for this)
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
# goto_tab 0 jumps back to the previously active tab
map ctrl+0 goto_tab 0

# ── Window tiling (splits) ───────────────────────────────────
# The splits layout allows arbitrary tmux-style arrangements. It is listed
# first, so it is the startup layout. Cycle layouts with Ctrl+Shift+L.
# split_axis is the fallback for splits made without an explicit --location:
# auto = split the longer axis. (horizontal = side by side, vertical = stacked.)
# Multiple layout options are separated by ";", layouts by ",".
enabled_layouts splits:split_axis=auto,stack,tall,fat,grid

# Directional splits. --location only takes effect in the splits layout;
# "split" picks the axis automatically (wide window -> right, tall -> down).
# Ctrl+Shift+ d and \ are the only mnemonic keys kitty leaves unbound here;
# ctrl+shift+enter deliberately replaces the default new_window.
#
# --cwd=oldest, not =current: "current" takes the cwd of the NEWEST process in
# the window's foreground process group. Claude Code spawns `xclip -selection`
# for the clipboard, and xclip daemonizes -- which means chdir("/") -- then
# lingers as long as it owns the selection. So a new tab/split opened from a
# Claude window inherited / instead of the project dir, and a claude started
# there was rooted at /. "oldest" takes the shell (or claude) instead.
map ctrl+shift+backslash launch --location=vsplit --cwd=oldest
map ctrl+shift+d         launch --location=hsplit --cwd=oldest
map ctrl+shift+enter     launch --location=split  --cwd=oldest

# New tab in the current directory (default ctrl+shift+t starts in $HOME).
# Runs the picker first: herdr (agent orchestrator) or a plain shell.
map ctrl+shift+t         launch --type=tab --cwd=oldest sh -c 'exec "$HOME/.local/bin/kitty-new-tab"'

# Move focus. Ctrl+arrow, not Ctrl+Shift+arrow, because kitty binds those to
# scroll_line_up/down and next_tab/previous_tab by default.
map ctrl+left  neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up    neighboring_window up
map ctrl+down  neighboring_window down

# Move the focused window within the layout
map ctrl+alt+left  move_window left
map ctrl+alt+right move_window right
map ctrl+alt+up    move_window up
map ctrl+alt+down  move_window down

# Flip a split's axis (rotate 180 instead swaps the two windows)
map ctrl+alt+r layout_action rotate

# Zoom the focused window, and even out all splits
map ctrl+alt+z toggle_layout stack
map ctrl+alt+e layout_action equalize

# Resize: Ctrl+Shift+R enters resize mode (arrows/hjkl, Esc to finish).
# "layout_action bias 70" gives the focused window 70% of its parent instead.

# ── Titles ───────────────────────────────────────────────────
# The default set_tab_title chord (ctrl+shift+alt+t) never reaches kitty:
# gnome-settings-daemon grabs the keycode for its <Primary><Alt>t terminal
# launcher even with Shift held, so kitty sees the modifiers and no "t".
map f2       set_tab_title
map shift+f2 set_window_title
